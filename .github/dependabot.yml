version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      tooling:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
          - "typescript"
          - "simple-git-hooks"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
